<style>

700;line-height:1.08;padding:0 4px}.feedback{height:20px;text-align:center;color:var(--accent);font-size:.83rem;font-weight:750;overflow:hidden}.tiles{display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(2,44px);gap:5px}.tile{border:1px solid #a7aaa6;border-radius:7px;background:var(--key);box-shadow:0 1px 2px #0002;font-size:clamp(1.08rem,4.8vw,1.55rem);font-weight:760}.tile:active{transform:translateY(1px);background:#e3ecee}.tools{display:grid;grid-template-columns:1fr auto auto;gap:5px}.tools button{height:36px;border:1px solid #aaa;border-radius:7px;background:var(--white);font-weight:730;padding:0 10px}.progress{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--muted)}.bar{height:5px;flex:1;background:#d4d4cf}.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
#keyboardInput{position:fixed;left:50%;bottom:0;width:1px;height:1px;opacity:.01;border:0;font-size:16px}.spark{position:fixed;z-index:8;pointer-events:none;font-size:1.25rem;animation:pop .75s ease-out forwards}@keyframes pop{to{transform:translate(var(--x),var(--y)) scale(.25);opacity:0}}#confetti{position:fixed;inset:0;pointer-events:none;z-index:20}.celebrate{position:fixed;z-index:21;inset:0;display:none;place-items:center;background:#fff8}.celebrate.show{display:grid}.celebrate div{background:var(--white);border:2px solid var(--ink);border-radius:16px;padding:24px;text-align:center;font-size:clamp(1.4rem,7vw,2.3rem);font-weight:850}.celebrate small{display:block;margin-top:8px;font-size:1rem;font-weight:600}.drawer{position:fixed;z-index:30;inset:0;background:#0005;display:none}.drawer.open{display:block}.sheet{height:100%;width:min(430px,94vw);background:var(--paper);padding:16px;overflow:auto;box-shadow:8px 0 25px #0004}.sheet h2{margin:0 0 4px}.sheet p{margin:0 0 14px;color:var(--muted)}.filters{display:grid;gap:8px}.filters label{font-size:.78rem;font-weight:800}.filters select{width:100%;height:46px;border:1px solid #999;background:var(--white);border-radius:8px;padding:0 10px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid #999;background:var(--white);border-radius:99px;padding:8px 12px}.chip.on{background:var(--ink);color:var(--white)}.puzzles{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.puzzles button{height:54px;border:1px solid #999;background:var(--white);border-radius:8px;font-weight:800}.puzzles button.on{background:var(--focus)}.close{position:absolute;top:10px;right:10px;border:0;background:transparent;font-size:1.7rem}.theme-dark{--paper:#232622;--white:#323631;--ink:#f2f1e9;--muted:#b7bbb5;--line:#a8aba5;--clue:#555a54;--focus:#285f70;--solved:#315a36;--key:#3a3e39}.theme-dark .clue .arrow{background:var(--clue)}

<script>

'Кино и театр':[['СЦЕНОГРАФ','Художник пространства спектакля'],['КИНОКАДР','Один неподвижный миг движущейся истории'],['АНТРАКТ','Пауза, когда зал снова начинает говорить'],['МОНОЛОГ','Речь, которой временно не нужен собеседник'],['РЕКВИЗИТ','Предмет, играющий роль на сцене'],['МОНТАЖ','Искусство соседства кадров'],['ПРЕМЬЕРА','Самая первая встреча произведения со зрителем'],['КУЛИСЫ','Граница между сценой и её тайной']],
'Еда и кухни мира':[['РИЗОТТО','Итальянский рис с кремовой логикой'],['ПАПРИКА','Пряность и овощ с одним именем'],['ФОКАЧЧА','Итальянская лепёшка с оливковым маслом'],['ХУМУС','Паста из нута, тахини и лимона'],['ПАЭЛЬЯ','Испанский рис, собирающий море и сушу'],['РАМЭН','Японская лапша в насыщенном бульоне'],['ПОЛЕНТА','Кукурузная каша Северной Италии'],['ШТРУДЕЛЬ','Рулет, у которого тесто должно быть тонким']],
'Пословицы и устойчивые выражения':[['ТЕРПЕНИЕ','Ключевое слово в пословице про труд'],['МОЛЧАНИЕ','То, что сравнивают с золотом'],['ВРЕМЯ','То, что лечит и всё расставляет'],['АППЕТИТ','Он приходит во время еды'],['КАМЕНЬ','Его вода точит не силой, а постоянством'],['ЯБЛОКО','Оно недалеко падает от дерева'],['ПОРОГ','Через него не передают и не здороваются'],['СЛОВО','Не воробей: вылетит — не поймаешь']],
'Искусство':[['АКВАРЕЛЬ','Живопись, где свет проходит сквозь краску'],['ГРАВЮРА','Изображение, отпечатанное с обработанной доски'],['МОЗАИКА','Картина, собранная из множества кусочков'],['ПЕРСПЕКТИВА','Способ показать глубину на плоскости'],['НАТЮРМОРТ','Портрет вещей без людей'],['ВИТРАЖ','Цветной свет, сложенный из стекла'],['ФРЕСКА','Роспись по свежей штукатурке'],['ПАЛИТРА','И краски художника, и круг его приёмов']],

const TILE_ALPHABET=['А','Б','В','Г','Д','Е','Ё','Ж','З','И','Й','К','Л','М','Н','О','П','Р','С','Т'];
const state={category:'Разминка',level:'средний',puzzle:0,active:0,cursor:0,values:{},solved:new Set(),hintMode:0};
const $=id=>document.getElementById(id);const clean=s=>s.toUpperCase().replace(/[^А-ЯЁ]/g,'');
function entries(){const bank=CATEGORIES[state.category];const shift=(state.puzzle*3)%bank.length;return Array.from({length:8},(_,i)=>{const item=bank[(i+shift)%bank.length];return{id:i,answer:clean(item[0]),clue:item[1],dir:i%2?'left':'right'}})}
function key(){return `scanword-v3:${state.category}:${state.level}:${state.puzzle}`}
function save(){localStorage.setItem(key(),JSON.stringify({values:state.values,solved:[...state.solved]}))}
function load(){state.values={};state.solved=new Set();try{const x=JSON.parse(localStorage.getItem(key())||'{}');state.values=x.values||{};state.solved=new Set(x.solved||[])}catch{}state.active=0;state.cursor=0}
function makeCell(cls,text,row,col,span=1){const b=document.createElement('button');b.className='cell '+cls;b.style.gridRow=row+1;b.style.gridColumn=`${col+1}/span ${span}`;b.textContent=text;return b}
function renderGrid(){const g=$('scanwordGrid');g.replaceChildren();const es=entries();const max=12;g.style.gridTemplateColumns=`repeat(${max+2},1fr)`;g.style.gridTemplateRows=`repeat(${es.length},1fr)`;es.forEach((e,r)=>{const len=Math.min(e.answer.length,max),left=e.dir==='right';const clueCol=left?0:max;const start=left?2:max-len;const clue=makeCell(`clue ${e.dir}${state.active===r?' active':''}`,e.clue,r,clueCol,2);const ar=document.createElement('span');ar.className='arrow';ar.textContent=left?'→':'←';clue.append(ar);clue.onclick=()=>selectWord(r);g.append(clue);for(let i=0;i<len;i++){const p=left?i:len-1-i;const cell=makeCell('letter','',r,start+i);cell.dataset.word=r;cell.dataset.pos=p;const val=(state.values[r]||'')[p]||'';cell.textContent=val;cell.classList.toggle('active',state.active===r);cell.classList.toggle('cursor',state.active===r&&state.cursor===p);cell.classList.toggle('solved',state.solved.has(r));cell.onclick=()=>{state.active=r;state.cursor=p;render()};g.append(cell)}const used=new Set([...Array(len)].map((_,i)=>start+i));used.add(clueCol);used.add(clueCol+1);for(let c=0;c<max+2;c++)if(!used.has(c)){const f=makeCell('clue filler',r%3===0?'↓':'·',r,c);f.disabled=true;g.append(f)}})}
function tilesFor(answer){const needed=[...new Set(answer.split(''))];const pool=[...needed,...TILE_ALPHABET,...'УФХЦЧШЩЪЫЬЭЮЯ'];const out=[];for(const x of pool)if(!out.includes(x))out.push(x);while(out.length<20)out.push(TILE_ALPHABET[out.length%TILE_ALPHABET.length]);return out.slice(0,20).sort(()=>Math.random()-.5)}
function renderTiles(){const box=$('letterTiles');box.replaceChildren();for(const ch of tilesFor(entries()[state.active].answer)){const b=document.createElement('button');b.className='tile';b.textContent=ch;b.onclick=()=>put(ch);box.append(b)}}
function render(){const es=entries(),e=es[state.active];$('puzzleTitle').textContent=`№${String(state.puzzle+1).padStart(3,'0')} · ${state.category}`;$('currentClue').textContent=e.clue;const done=state.solved.size;$('progressText').textContent=`${done}/${es.length}`;$('progressBar').style.width=`${done/es.length*100}%`;renderGrid();renderTiles();save()}
function selectWord(i){state.active=(i+entries().length)%entries().length;const a=entries()[state.active].answer,v=state.values[state.active]||'';state.cursor=Math.min(v.length,a.length-1);$('feedback').textContent='';render()}
function put(ch){const e=entries()[state.active],a=e.answer;let v=(state.values[state.active]||'').padEnd(a.length,' ').slice(0,a.length).split('');v[state.cursor]=ch;state.values[state.active]=v.join('').trimEnd();let next=v.findIndex((x,i)=>i>state.cursor&&x===' ');if(next<0)next=v.findIndex(x=>x===' ');if(next>=0)state.cursor=next;else checkWord();render()}
function erase(){const a=entries()[state.active].answer;let v=(state.values[state.active]||'').padEnd(a.length,' ').slice(0,a.length).split('');if(v[state.cursor])v[state.cursor]=' ';else state.cursor=Math.max(0,state.cursor-1),v[state.cursor]=' ';state.values[state.active]=v.join('').trimEnd();state.solved.delete(state.active);$('feedback').textContent='';render()}
function checkWord(){const e=entries()[state.active],v=(state.values[state.active]||'').replace(/ /g,'');if(v.length<e.answer.length)return;if(v===e.answer){if(!state.solved.has(state.active)){state.solved.add(state.active);$('feedback').textContent=['Точно! Отличное слово ✦','Есть! Очень хорошо ✦','Верно — мягко и уверенно ✦'][state.active%3];sparkle()}if(state.solved.size===entries().length)finish()}else $('feedback').textContent='Можно попробовать иначе — буквы останутся на месте.'}
function sparkle(){for(let i=0;i<10;i++){const s=document.createElement('i');s.className='spark';s.textContent='✦';s.style.left=`${45+Math.random()*10}%`;s.style.top='73%';s.style.setProperty('--x',`${(Math.random()-.5)*150}px`);s.style.setProperty('--y',`${-25-Math.random()*80}px`);document.body.append(s);setTimeout(()=>s.remove(),800)}}
function finish(){const c=$('confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const bits=Array.from({length:130},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.3,v:2+Math.random()*4,r:2+Math.random()*5,h:Math.random()*360}));let t=0;(function frame(){x.clearRect(0,0,c.width,c.height);for(const b of bits){b.y+=b.v;b.x+=Math.sin((b.y+b.h)/24);x.fillStyle=`hsl(${b.h} 72% 48%)`;x.fillRect(b.x,b.y,b.r,b.r*1.8)}if(t++<150)requestAnimationFrame(frame);else x.clearRect(0,0,c.width,c.height)})();$('celebrate').classList.add('show');setTimeout(()=>$('celebrate').classList.remove('show'),2300)}
function fillHint(){const e=entries()[state.active],v=(state.values[state.active]||'').padEnd(e.answer.length,' ').split('');if(state.hintMode%3===0){const i=v.findIndex((x,j)=>x!==e.answer[j]);if(i>=0)v[i]=e.answer[i];state.values[state.active]=v.join('').trimEnd();$('feedback').textContent='Открыта одна буква — без штрафа.'}else if(state.hintMode%3===1){$('feedback').textContent='Добавлены новые буквы-подсказки — без штрафа.'}else{state.values[state.active]=e.answer;state.cursor=e.answer.length-1;$('feedback').textContent='Слово открыто — без штрафа.';checkWord()}state.hintMode++;render()}
function populateCatalog(){const s=$('categoryFilter');Object.keys(CATEGORIES).forEach(n=>{const o=document.createElement('option');o.value=o.textContent=n;s.append(o)});s.value=state.category;s.onchange=()=>{state.category=s.value;state.puzzle=0;load();populatePuzzles();render()};populatePuzzles()}
function populatePuzzles(){const p=$('puzzleList');p.replaceChildren();for(let i=0;i<3;i++){const b=document.createElement('button');b.textContent=`№${String(i+1).padStart(3,'0')}`;b.classList.toggle('on',state.puzzle===i);b.onclick=()=>{state.puzzle=i;load();populatePuzzles();render();$('drawer').classList.remove('open')};p.append(b)}}
$('prevWord').onclick=()=>selectWord(state.active-1);$('nextWord').onclick=()=>selectWord(state.active+1);$('erase').onclick=erase;$('hint').onclick=fillHint;$('nativeKeyboard').onclick=()=>{const i=$('keyboardInput');i.value='';i.focus()};$('keyboardInput').oninput=e=>{const ch=clean(e.target.value).slice(-1);if(ch)put(ch);e.target.value=''};$('keyboardInput').onkeydown=e=>{if(e.key==='Backspace')erase()};$('menu').onclick=()=>$('drawer').classList.add('open');$('closeMenu').onclick=()=>$('drawer').classList.remove('open');$('drawer').onclick=e=>{if(e.target===$('drawer'))$('drawer').classList.remove('open')};$('theme').onclick=()=>document.body.classList.toggle('theme-dark');$('layout').onclick=()=>{$('boardWrap').classList.toggle('zoom');$('feedback').textContent=$('boardWrap').classList.contains('zoom')?'Крупный режим: сетку можно прокручивать.':'Вся сетка снова помещается на экран.'};$('back').onclick=()=>history.length>1?history.back():null;$('celebrate').onclick=()=>$('celebrate').classList.remove('show');$('difficulty').onclick=e=>{if(!e.target.dataset.level)return;state.level=e.target.dataset.level;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===e.target));load();render()};document.addEventListener('keydown',e=>{if(/^[а-яё]$/i.test(e.key))put(e.key.toUpperCase());if(e.key==='Backspace')erase();if(e.key==='ArrowLeft')state.cursor=Math.max(0,state.cursor-1),render();if(e.key==='ArrowRight')state.cursor=Math.min(entries()[state.active].answer.length-1,state.cursor+1),render()});
window.render_game_to_text=()=>JSON.stringify({coordinateSystem:'rows top-to-bottom; positions follow arrow direction',category:state.category,difficulty:state.level,puzzle:state.puzzle+1,activeWord:state.active+1,clue:entries()[state.active].clue,letters:state.values[state.active]||'',wordLength:entries()[state.active].answer.length,solved:[...state.solved],total:entries().length});window.advanceTime=()=>{};
populateCatalog();load();render();
</script>
</body></html>
